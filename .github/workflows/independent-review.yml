name: Independent AI review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  codex:
    name: Codex review of current commit
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # No checkout or execution of PR code in this privileged job.
      - name: Request review and require evidence of completion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const observed = async () => {
              const comments = await github.paginate(github.rest.issues.listComments,
                {owner, repo, issue_number: pull_number, per_page: 100});
              for (const comment of comments.reverse()) {
                if (comment.user?.login !== 'chatgpt-codex-connector[bot]') continue;
                const match = comment.body?.match(/<!-- codex-review-state:v1 (.*?) -->/);
                if (!match) continue;
                try {
                  const state = JSON.parse(match[1]).code_review;
                  if (state?.commit_sha === head) return {state, url: comment.html_url};
                } catch { /* Malformed/incompatible state is never a successful review. */ }
              }
              return null;
            };
            let review = await observed();
            if (!review) {
              await github.rest.issues.createComment({owner, repo, issue_number: pull_number,
                body: '@codex review'});
            }
            for (let attempt = 0; attempt < 30; attempt++) {
              if (review?.state.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 20000));
              review = await observed();
            }
            if (!review || review.state.status !== 'completed' ||
                typeof review.state.has_unresolved_findings !== 'boolean') {
              core.setFailed('No completed independent Codex review found for this commit.');
              return;
            }
            await core.summary.addHeading('Independent review completed')
              .addLink('Review on this commit', review.url)
              .addRaw(`\nCommit: ${head}\n\nCompletion is not human approval; resolve findings before merge.`)
              .write();
            if (review.state.has_unresolved_findings) {
              core.setFailed('Independent reviewer has unresolved findings on this commit.');
            }
