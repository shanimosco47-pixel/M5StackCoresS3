name: Relay checks
on:
  push:
    branches: [main, feature/cloud-voice-relay]
    paths: ['server/**', '.github/**', 'tools/cloud/**', 'tools/diagnostics/**', 'firmware/stackchan-idf/**', 'firmware/stackchan-idf/tools/test_relay.cpp']
  pull_request:
    paths: ['server/**', '.github/**', 'tools/cloud/**', 'tools/diagnostics/**', 'firmware/stackchan-idf/**', 'firmware/stackchan-idf/tools/test_relay.cpp']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware-host:
    name: Relay firmware parsing, VAD and cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise actual portable firmware core
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Ifirmware/stackchan-idf/components/conversation firmware/stackchan-idf/tools/test_relay.cpp -o "$RUNNER_TEMP/test-relay"
          "$RUNNER_TEMP/test-relay"
  test:
    name: Python ${{ matrix.python }} behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r server/requirements.txt
      - name: Exercise relay and provider boundaries without secrets or external AI calls
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Verify the actual independent-review gate against controlled GitHub states
        run: python -m unittest discover -s .github/tests -v
  security:
    name: Independent static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt bandit pip-audit ruff
      - name: Python errors and unsafe constructs
        run: python -m ruff check server tools/cloud tools/diagnostics --select E9,F63,F7,F82
      - name: Independent Bandit review of production relay
        run: python -m bandit -r server/relay tools/cloud tools/diagnostics -ll
      - name: Known dependency vulnerabilities
        run: python -m pip_audit -r server/requirements.txt
      - name: PowerShell deployment script syntax
        shell: pwsh
        run: |
          $m5ParseTokens = $null
          $m5ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/tools/cloud/deploy_private.ps1",
            [ref]$m5ParseTokens, [ref]$m5ParseErrors) | Out-Null
          if ($m5ParseErrors.Count -gt 0) { throw ($m5ParseErrors | Out-String) }
